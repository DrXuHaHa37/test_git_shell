# .rysen_sync_conf —— rysen 项目同步配置模板
#
# 放置位置：需要同步的项目根目录（本文件: data_pipeline/.rysen_sync_conf）
# copy_push_flow.sh 会扫描其父目录下所有含本文件的目录，作为待同步项目。
#
# 语法：
#   - `#` 开头为注释，空行忽略，行首尾空白会被裁剪
#   - 默认处于 [config] 段，格式为 KEY = VALUE
#   - [exclude] 段之后的每一行都是一条 rsync --exclude 规则（相对源目录根）

# ===== 必填 =====
# 同步的目标 git 仓库（脚本会在其中建分支、提交、推送、创建 PR）
DST_DIR = /home/yszn/Documents/test_git_shell

# ===== 可选 =====
# 远端名称，默认 origin
REMOTE = origin
# PR 的目标分支，默认取远端默认分支，取不到则为 main
BASE_BRANCH = main
# 自动创建分支的前缀，分支名为 refactor/YYYYMMDDHHMMSS
BRANCH_PREFIX = sync
# PR 标题，默认同提交信息
PR_TITLE = chore: sync data_pipeline

# ===== 剔除项 =====
[exclude]
# 版本控制与本机元信息
.git/
.rysen_sync_conf
.gitignore
# Python 中间产物
__pycache__/
*.pyc
*.pyo
.venv/
venv/
*.egg-info/
# 数据与日志：体积大、不适合进 git
*.mcap
*.bag
*.log
data_processing/output/
data_processing/tmp/
data_processing/data/
data_processing/logs/
