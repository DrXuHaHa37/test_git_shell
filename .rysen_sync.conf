# .rysen_sync_conf —— rysen 项目同步配置模板
#
# 放置位置：需要同步的项目根目录（本文件: data_pipeline/.rysen_sync.conf）
#
# 语法：
#   - `#` 开头为注释，空行忽略，行首尾空白会被裁剪
#   - 默认处于 [config] 段，格式为 KEY = VALUE
#   - [exclude] 段之后的每一行都是一条 rsync --exclude 规则（相对源目录根）

# ===== 必填 =====
# 同步的目标 git 仓库（脚本会在其中建分支、提交、推送、创建 PR）
# DST_DIR = /your/local/github-project/root/path
DST_DIR = /home/yszn/Documents/test_git_shell
# PR 的目标分支：必填，未配置则报错（不再回退到 main）
TARGET_BRANCH = main

# ===== 可选 =====
# 注：REMOTE 固定为 origin、分支前缀固定为 sync，均不可在此配置
# PR 标题，默认同提交信息
PR_TITLE = chore: sync data_pipeline

# ===== 剔除项 =====
# 自动合并 PARENT_DIR/.gitignore 与本项目 .gitignore 的忽略规则（去重）；
# 以下 [exclude] 中只写 .gitignore 没有的额外剔除项
[exclude]
data_processing/src/
